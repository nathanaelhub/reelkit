name: release
# Attaches the Claude Desktop extensions (.mcpb, built and tested by scripts/pack-mcpb.mjs) to each published release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build and attach to (e.g. v0.14.0)
        required: true
permissions:
  contents: write
jobs:
  mcpb:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node scripts/pack-mcpb.mjs
      - run: gh release upload "$TAG" dist/*.mcpb --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
