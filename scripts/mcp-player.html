<!doctype html>
<!--
  reelkit's player for AI apps that show MCP Apps views (Claude, ChatGPT, VS Code…): `show` links to this page, the
  app puts it in the chat, and it reads the reel's 720p chat copy from the server in parts (reelkit-video://slug/n).
  It loads nothing from the internet: the app's default Content-Security-Policy applies (no domains are declared).
  scripts/mcp-server.mjs puts the MCP Apps SDK (ext-apps app-with-deps.js) where the marker below is.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>reelkit player</title>
<style>
  :root {
    --bg: var(--color-background-primary, #fff);
    --fg: var(--color-text-primary, #1d1d1f);
    --muted: var(--color-text-secondary, #6e6e73);
    --line: var(--color-border-primary, rgba(0,0,0,.14));
    --button: var(--color-background-secondary, #f2f2f4);
    --zone: rgba(214, 36, 110, .38);
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1c1c1e); --fg: var(--color-text-primary, #f5f5f7);
      --muted: var(--color-text-secondary, #a1a1a6); --line: var(--color-border-primary, rgba(255,255,255,.16));
      --button: var(--color-background-secondary, #2c2c2e);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1c1e); --fg: var(--color-text-primary, #f5f5f7);
    --muted: var(--color-text-secondary, #a1a1a6); --line: var(--color-border-primary, rgba(255,255,255,.16));
    --button: var(--color-background-secondary, #2c2c2e);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--fg); font: 14px/1.4 var(--font); }
  main { padding: 8px 0; }
  .wrap { width: min(100%, 360px); margin: 0 auto; }
  .wrap.wide { width: min(100%, 640px); }
  main[hidden], [hidden] { display: none !important; }
  .frame { position: relative; width: 100%; aspect-ratio: var(--ratio, 9 / 16);
    border-radius: 12px; overflow: hidden; background: #000; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .zones { position: absolute; inset: 0; pointer-events: none; }
  .zone.side { writing-mode: vertical-rl; }
  .zone { position: absolute; background: var(--zone); border: 2px dashed rgba(255,255,255,.9); color: #fff;
    font: 600 12px/1.2 var(--font); display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; }
  .status { display: flex; align-items: center; justify-content: center; height: 100%; color: #fff; padding: 24px; text-align: center; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .info { flex: 1 1 100%; min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; }
  button { font: inherit; color: var(--fg); background: var(--button); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--zone); color: #fff; border-color: transparent; }
  button:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  .error { color: #fff; }
  .error small { display: block; margin-top: 6px; opacity: .8; }
</style>
</head>
<body>
<main id="main" hidden>
<div class="wrap" id="wrap">
  <div class="frame" id="frame">
    <div class="status" id="status" role="status">Loading the video…</div>
    <video id="video" controls playsinline loop preload="auto" hidden></video>
    <div class="zones" id="zones" hidden aria-hidden="true"></div>
  </div>
  <div class="bar">
    <div class="info"><div class="title" id="title"></div><div class="meta" id="meta"></div></div>
    <button type="button" id="zones-btn" aria-pressed="false" hidden>Safe zones</button>
    <button type="button" id="open-btn">Open full quality</button>
  </div>
</div>
</main>
<script type="module">
/*APP_SDK*/
const { App, applyDocumentTheme, applyHostStyleVariables, applyHostFonts } = window.__mcpApps;
const $ = id => document.getElementById(id);
const main = $('main'), frame = $('frame'), status = $('status'), video = $('video'), zones = $('zones');
const zonesBtn = $('zones-btn'), openBtn = $('open-btn');
let current = null;

const say = (msg, detail) => {
  status.hidden = false; video.hidden = true;
  status.className = detail !== undefined ? 'status error' : 'status';
  status.textContent = msg;
  if (detail) { const s = document.createElement('small'); s.textContent = detail; status.appendChild(s); }
};
const secs = s => s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : `${s.toFixed(1)} s`;

function drawZones(z) {
  zones.textContent = '';
  const box = (css, label, side) => { const d = document.createElement('div'); d.className = side ? 'zone side' : 'zone'; d.style.cssText = css; d.textContent = label; zones.appendChild(d); };
  box(`left:0;top:0;width:100%;height:${z.top * 100}%`, 'app header');
  box(`left:0;bottom:0;width:100%;height:${z.bottom * 100}%`, 'name, caption, music');
  box(`right:0;top:${z.top * 100}%;width:${z.right * 100}%;height:${(1 - z.top - z.bottom) * 100}%`, 'buttons', true);
}

// the parts are base64 of 1,048,575-byte slices (a multiple of 3), so they join into one base64 string
async function load(info) {
  const b64 = [];
  for (let i = 0; i < info.parts; i++) {
    say(info.parts > 1 ? `Loading the video… (part ${i + 1} of ${info.parts})` : 'Loading the video…');
    const r = await app.readServerResource({ uri: `reelkit-video://${info.reel}/${i}` });
    const c = r.contents && r.contents[0];
    if (!c || typeof c.blob !== 'string') throw new Error('the server sent no video data');
    b64.push(c.blob);
  }
  return b64.join('');
}

// a blob: URL if the app's policy allows it, else a data: URL (the MCP Apps default policy allows media from data:)
function play(b64, type) {
  return new Promise((resolve, reject) => {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type }));
    let triedData = false;
    const ok = () => { cleanup(); resolve(triedData ? 'data' : 'blob'); };
    const bad = () => {
      if (!triedData) { triedData = true; URL.revokeObjectURL(url); video.src = `data:${type};base64,${b64}`; video.load(); return; }
      cleanup(); reject(new Error('this app could not play the video'));
    };
    const cleanup = () => { video.removeEventListener('loadeddata', ok); video.removeEventListener('error', bad); };
    video.addEventListener('loadeddata', ok);
    video.addEventListener('error', bad);
    video.src = url; video.load();
  });
}

async function show(info) {
  current = info;
  main.hidden = false;
  $('title').textContent = info.title || info.reel;
  $('meta').textContent = `${secs(info.duration)}, ${Math.min(info.width, info.height) || 720}p preview`;
  if (info.width && info.height) { frame.style.setProperty('--ratio', `${info.width} / ${info.height}`); $('wrap').classList.toggle('wide', info.width > info.height); }
  zonesBtn.hidden = !info.safeZones;
  if (info.safeZones) drawZones(info.safeZones);
  try {
    const b64 = await load(info);
    say('Starting the video…');
    const how = await play(b64, info.mimeType || 'video/mp4');
    document.documentElement.dataset.source = how; // read by tests/player-check.mjs
    status.hidden = true; video.hidden = false;
  } catch (e) {
    say('The video couldn\'t load here.', `${e.message || e}. Ask to show the reel again, or use Open full quality.`);
  }
}

zonesBtn.addEventListener('click', () => {
  const on = zonesBtn.getAttribute('aria-pressed') !== 'true';
  zonesBtn.setAttribute('aria-pressed', String(on));
  zones.hidden = !on;
});
openBtn.addEventListener('click', async () => {
  if (!current) return;
  openBtn.disabled = true;
  try {
    const r = await app.callServerTool({ name: 'show', arguments: { reel: current.reel, open: true } });
    openBtn.textContent = r.isError ? 'Couldn\'t open it' : 'Opened in the video player';
  } catch { openBtn.textContent = 'Couldn\'t open it'; }
  setTimeout(() => { openBtn.disabled = false; openBtn.textContent = 'Open full quality'; }, 4000);
});

const theme = ctx => {
  if (!ctx) return;
  if (ctx.theme) applyDocumentTheme(ctx.theme);
  if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
  if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
  if (ctx.safeAreaInsets) { const s = ctx.safeAreaInsets; main.style.padding = `${s.top + 8}px ${s.right}px ${s.bottom + 8}px ${s.left}px`; }
};
const app = new App({ name: 'reelkit player', version: '1' }, {}, { autoResize: true });
app.ontoolresult = r => {
  const info = r.structuredContent;
  if (info && info.parts > 0) show(info);
  else if (info && info.pending) { main.hidden = false; say('The preview is still being made. Ask to show the reel again in a moment.'); }
  // anything else (frames for the model, an error) has nothing to play: the view stays empty
};
app.onhostcontextchanged = theme;
await app.connect();
theme(app.getHostContext());
</script>
</body>
</html>
