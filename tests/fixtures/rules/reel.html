<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Design rule fixture</title>
<link rel="stylesheet" href="../../../engine/kit.css">
<style>
  .slop-bg { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); }
  .card-x { transition: all .3s ease; }
  @keyframes wobble { from { rotate: -3deg; } to { rotate: 3deg; } }
</style>
</head>
<body>
<div id="stage">
  <section class="scene slop-bg" data-scene="slop">
    <h1 class="pad display center-text" style="top:600px" data-anim="pop" data-at="@everything">Game changer</h1>
    <div class="abs card card-x" style="left:200px;top:1000px;width:300px;height:200px" data-anim="rise" data-ease="out"></div>
    <div class="abs card" style="left:600px;top:1000px;width:200px;height:200px;animation: wobble 1s infinite" data-anim="fade"></div>
  </section>
  <section class="scene bg-grid" data-scene="control">
    <h1 class="pad display center-text" style="top:400px" data-anim="pop" data-ease="spring-bouncy">Pattern ok</h1>
    <div class="abs bg-paper" style="left:0;top:900px;width:1080px;height:500px">
      <h2 class="pad display center-text" style="top:120px" data-anim="rise" data-at="@more">Vignette ok</h2>
    </div>
  </section>
</div>
<script src="../../../engine/kit.js"></script>
<script>Reel.init();</script>
</body>
</html>
