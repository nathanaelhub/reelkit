<!doctype html>
<meta charset="utf-8">
<title>reelkit score</title>
<script>
// Seeded random numbers before Tone.js loads, so noise and any randomness in a score render the same every time.
(() => { let s = 0x2f6b9a1d; Math.random = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })();
</script>
<script src="/node_modules/tone/build/Tone.js"></script>
<script type="module">
import { createScore } from './score-kit.js';
window.renderScore = async (scoreURL, tl, sampleRate = 44100) => {
  const mod = await import(scoreURL);
  const fn = mod.default; if (typeof fn !== 'function') throw new Error('score.js must `export default function ({ bed, sfx, at, Tone }) { … }`');
  const buf = await Tone.Offline(async () => { await fn(createScore(Tone, tl)); }, tl.duration, 2, sampleRate);
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const pcm = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) { pcm[2 * i] = Math.max(-1, Math.min(1, L[i])) * 32767; pcm[2 * i + 1] = Math.max(-1, Math.min(1, R[i])) * 32767; }
  const head = new DataView(new ArrayBuffer(44)), str = (o, s) => [...s].forEach((c, i) => head.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); head.setUint32(4, 36 + pcm.byteLength, true); str(8, 'WAVEfmt '); head.setUint32(16, 16, true); head.setUint16(20, 1, true); head.setUint16(22, 2, true);
  head.setUint32(24, sampleRate, true); head.setUint32(28, sampleRate * 4, true); head.setUint16(32, 4, true); head.setUint16(34, 16, true); str(36, 'data'); head.setUint32(40, pcm.byteLength, true);
  const bytes = new Uint8Array(44 + pcm.byteLength); bytes.set(new Uint8Array(head.buffer), 0); bytes.set(new Uint8Array(pcm.buffer), 44);
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  return { wav: btoa(bin), peak };
};
window.scoreReady = true;
</script>
